apis:
- aid: bank-of-queensland:bank-of-queensland-cdr-product-reference-data-api
  name: Bank of Queensland (BOQ) CDR Product Reference Data API
  tags:
  - CDR
  - Open Banking
  - Product Reference Data
  - Banking
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.boq.com.au/personal/banking/openbanking/developers
  baseURL: https://secure.api.boq.com.au/cds-au/v1/banking/products
  properties:
  - url: https://www.boq.com.au/personal/banking/openbanking/developers
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#product-reference-data
    type: APIReference
  - url: openapi/bank-of-queensland-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Public, unauthenticated Consumer Data Right (CDR) Product Reference
    Data API exposing BOQ's banking products (accounts, term deposits, loans, cards)
    in machine-readable form under the Australian Consumer Data Standards. Confirmed
    live at https://secure.api.boq.com.au/cds-au/v1/banking/products (HTTP 200, x-v
    3) returning a data.products array. Endpoints - GET /banking/products and GET
    /banking/products/{productId}. This is the only openly callable CDR surface; all
    other Banking families below require consumer authorization via the CDR / ADR model.
- aid: bank-of-queensland:bank-of-queensland-cdr-accounts-balances-api
  name: Bank of Queensland (BOQ) CDR Accounts & Balances API
  tags:
  - CDR
  - Open Banking
  - Accounts
  - Balances
  - Banking
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.boq.com.au/personal/banking/openbanking/developers
  baseURL: https://secure.api.boq.com.au/cds-au/v1/banking/accounts
  properties:
  - url: https://www.boq.com.au/personal/banking/openbanking/developers
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#accounts
    type: APIReference
  - url: openapi/bank-of-queensland-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Consumer Data Right (CDR) Accounts and Balances
    API. Under the Australian Consumer Data Standards banking surface that BOQ is
    legally required to implement, this family covers Get Accounts (GET /banking/accounts),
    Get Account Detail (GET /banking/accounts/{accountId}), Get Bulk Balances (GET
    /banking/accounts/balances), and Get Account Balance (GET /banking/accounts/{accountId}/balance).
    Access requires a consented, authorized session through the regulated CDR /
    Accredited Data Recipient (ADR) model using OAuth2 / OIDC (FAPI) and MTLS - it
    is not openly callable. Endpoints are defined by the shared DSB CDR Banking API
    standard, not a BOQ-proprietary contract.
