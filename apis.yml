name: Bank of Queensland
kind: company
description: Bank of Queensland Limited (ASX code BOQ) is one of Australia's oldest
  banks,
  founded in Brisbane in 1874, and today an APRA-regulated authorised deposit-taking
  institution (ADI) and ASX-listed regional retail and commercial bank - a publicly
  listed company, not a customer-owned mutual. Its banking group includes the ME Bank,
  Virgin Money Australia and BOQ Specialist brands. As an accredited Consumer Data
  Right (CDR) data holder, BOQ exposes a public, unauthenticated Product Reference
  Data (PRD) API that conforms to the Australian Consumer Data Standards, while
  consumer data sharing runs through the regulated CDR / Accredited Data Recipient
  (ADR) model with OAuth2 / OIDC (FAPI) authorization.
