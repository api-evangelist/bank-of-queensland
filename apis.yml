  description: Consumer-authorized Consumer Data Right (CDR) Payees API. Part of the
    Australian Consumer Data Standards banking surface BOQ implements as an
    accredited data holder, this family covers Get Payees (GET /banking/payees) and
    Get Payee Detail (GET /banking/payees/{payeeId}), returning a consumer's saved
    payees. Access requires a consented, authorized session through the regulated
    CDR / Accredited Data Recipient (ADR) model using OAuth2 / OIDC (FAPI) and MTLS
    - it is not openly callable. Endpoints are defined by the shared DSB CDR Banking
