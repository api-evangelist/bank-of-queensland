    description: Product constraint (e.g. MIN_BALANCE, MAX_LIMIT).
  - name: BankingProductFee
    key_schemas: [BankingProductFeeV2]
    description: A fee associated with the product (with optional discounts).
  - name: BankingProductDepositRate
    key_schemas: [BankingProductDepositRateV2]
    description: Deposit interest rate tier for the product.
  - name: BankingProductLendingRate
    key_schemas: [BankingProductLendingRateV3]
    description: Lending interest rate tier for the product.
  - name: BankingProductEligibility
    key_schemas: [BankingProductEligibilityV2]
    description: Eligibility criterion for the product.
relationships:
  - from: BankingProductDetail
    to: BankingProductFeature
