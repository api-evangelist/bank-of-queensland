# Entity-relationship graph DERIVED from the CDR Banking API schemas. Scoped to
# the public Product Reference Data domain (the developer-accessible surface).
entities:
  - name: BankingProduct
    id_field: productId
    key_schemas: [BankingProductV6, BankingProductListV4]
    description: A banking product openly offered to the market (from GET /banking/products).
  - name: BankingProductDetail
    id_field: productId
