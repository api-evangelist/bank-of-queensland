notes: >-
  There is deliberately no id linking a BankingAccount to the BankingProduct it
  originated from - the CDS regime keeps product and account payloads separate
  (productCategory is the only shared field). Account/transaction/payee entities
  belong to the authenticated CDR consumer-data domain and are out of scope here.
