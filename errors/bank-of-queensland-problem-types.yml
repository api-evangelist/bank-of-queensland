# BOQ's CDR Banking API returns errors in the Consumer Data Standards (CDS)
# ResponseErrorListV2 envelope - NOT RFC 9457 problem+json. Each error carries a
# CDR-standard URN code, a human title, a detail string, and an optional meta object.
# Codes below are DERIVED from the 4xx responses declared in the harvested DSB spec
# and enriched with the canonical urn:au-cds:error registry from the CDS docs.
format: cds-responseerrorlistv2
envelope:
  media_type: application/json
  shape: '{ "errors": [ { "code": "urn:au-cds:error:...", "title": "...", "detail": "...", "meta": {} } ] }'
  note: >-
    Consumer Data Standards error format. Not RFC 9457. The public Product
    Reference Data endpoints (GET /banking/products, /banking/products/{productId})
    surface only the common/pagination/header error classes; the account,
    transaction, balance, payee and payment error classes apply to the
    authenticated CDR consumer-data endpoints, which are gated behind the
    Accredited Data Recipient (ADR) OAuth2/FAPI model and not open to
    arbitrary developers.
