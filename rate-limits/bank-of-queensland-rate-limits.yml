name: Bank of Queensland rate limits
generated: '2026-10-20'
method: searched
source: https://consumerdatastandardsaustralia.github.io/standards/
note: >-
  BOQ publishes no rate-limit page of its own. These are the traffic thresholds
  the Consumer Data Standards (Non-functional Requirements > Traffic Thresholds)
  set for every CDR data holder, BOQ included: calls above them "will be able to
  be freely throttled or rejected by a data holder". They are regulatory
  thresholds, not BOQ-published quotas. The harvested CDS contract declares no
  429 response and no RateLimit/Retry-After headers.
headers: []
